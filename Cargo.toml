[package]
name = "re_becca"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[lib]
name = "re_becca"
path = "src/lib.rs"

[[bin]]
name = "rebecca"
path = "src/main.rs"
